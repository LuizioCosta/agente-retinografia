# Gera o APK Android do "Agente de Retinografia" na nuvem do GitHub (sem instalar Android Studio).
# Resultado: aba "Releases" do repositório → Agente-de-Retinografia.apk (baixe direto no celular).
name: Gerar APK Android
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run android:preparar
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Agente-de-Retinografia.apk
      - uses: actions/upload-artifact@v4
        with: { name: Agente-de-Retinografia-apk, path: app/Agente-de-Retinografia.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Agente de Retinografia 1.0.${{ github.run_number }}
          body: "Baixe o arquivo Agente-de-Retinografia.apk no celular Android e toque nele para instalar."
          files: app/Agente-de-Retinografia.apk
